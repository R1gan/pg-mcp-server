version: '3.8'

services:
  pg-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg-mcp
    # Host networking so the container shares the host loopback and can reach the
    # SSH tunnel on 127.0.0.1:5432. Server still binds 8000 directly on the host.
    network_mode: "host"
    environment:
      - LOG_LEVEL=DEBUG
      - PYTHONUNBUFFERED=1
    volumes:
      # For development: mount app directory to enable hot-reloading
      - ./server:/app/server
    restart: unless-stopped
